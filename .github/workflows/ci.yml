name: CI

# The seatbelt for an ambitious, self-modifying factory: lint, type-check, and
# the full hermetic test suite on every push/PR. The suite is offline by design
# (conftest pins SKYN3T_LLM_BACKEND=stub and neuters the CLI-vision fallback), so
# no keys or network are needed here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep both existing Linux versions, then add one current-version
          # platform leg for Windows and macOS. This catches OS-specific process,
          # path, browser, and native-toolchain regressions without multiplying
          # every supported Python version across every hosted runner.
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6.1.0
        with:
          node-version: "22"

      - name: Install test environment
        # Dev owns the Python web/visual dependencies so integration tests do
        # not silently skip. Heavy ML remains optional.
        run: pip install -e ".[dev]"

      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Verify macOS Swift toolchain
        if: runner.os == 'macOS'
        run: |
          swift --version
          xcodebuild -version

      - name: Lint (ruff)
        if: runner.os == 'Linux'
        run: ruff check skyn3t tests

      - name: Type-check Python package
        if: runner.os == 'Linux'
        run: mypy skyn3t

      - name: Tests (pytest, hermetic offline suite)
        env:
          SKYN3T_LLM_BACKEND: stub
        run: python -m pytest -q

  python-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test environment
        run: pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q skyn3t

      - name: Import and settings smoke tests
        env:
          SKYN3T_LLM_BACKEND: stub
        run: >-
          python -m pytest -q
          tests/test_settings_layout.py
          tests/test_agents_review_verify.py::test_modules_import_without_side_effects
          tests/test_web_api.py::test_modules_import_without_side_effects

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skyn3t/web/ui/package-lock.json

      - name: Install frontend deps
        working-directory: skyn3t/web/ui
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: skyn3t/web/ui
        run: npm audit --audit-level=high

      - name: Test frontend
        working-directory: skyn3t/web/ui
        run: npm test

      - name: Build frontend
        working-directory: skyn3t/web/ui
        run: npm run build

      - name: Set up Python for package smoke test
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Install release validation tools
        run: >-
          python -m pip install
          "setuptools>=77" wheel
          "build>=1.3,<2" "twine>=6,<7" "check-wheel-contents>=0.6,<1"

      - name: Build direct wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w wheelhouse

      - name: Build sdist and rebuild its wheel
        run: |
          python -m build --sdist --no-isolation --outdir release-dist
          python -m pip wheel release-dist/*.tar.gz --no-deps --no-build-isolation -w sdist-wheelhouse

      - name: Verify release artifacts
        run: |
          python scripts/check_release_wheel.py "wheelhouse/*.whl" --compare "sdist-wheelhouse/*.whl"
          python -m twine check release-dist/* wheelhouse/*.whl sdist-wheelhouse/*.whl
          check-wheel-contents wheelhouse/*.whl
          check-wheel-contents sdist-wheelhouse/*.whl

      - name: Smoke-test the installed wheel
        run: |
          WHEEL=$(find wheelhouse -name '*.whl' -print -quit)
          python -m pip install --force-reinstall "${WHEEL}[web]" httpx2
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"
