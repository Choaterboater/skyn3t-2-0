name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build reproducible distributions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag, package version, and main ancestry
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          python scripts/prepare_release.py check-tag --tag "$GITHUB_REF_NAME"
          python scripts/prepare_release.py check-ancestry \
            --commit "$GITHUB_SHA" \
            --main-ref origin/main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skyn3t/web/ui/package-lock.json

      - name: Install test and release tools
        run: >-
          python -m pip install -e ".[dev]"
          "build>=1.3,<2" "twine>=6,<7" "check-wheel-contents>=0.6,<1"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test and rebuild dashboard
        working-directory: skyn3t/web/ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Require committed dashboard output
        run: git diff --exit-code -- skyn3t/web/ui/dist

      - name: Run release quality gates
        env:
          SKYN3T_LLM_BACKEND: stub
        run: |
          ruff check skyn3t tests scripts
          mypy skyn3t
          python -m pytest -q

      - name: Build twice from the tagged source
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python -m build --no-isolation --outdir release-a
          sleep 2
          python -m build --no-isolation --outdir release-b

      - name: Normalize and verify reproducibility
        run: >-
          python scripts/prepare_release.py verify
          --dist release-a
          --compare release-b
          --tag "$GITHUB_REF_NAME"
          --epoch "$SOURCE_DATE_EPOCH"
          --checksums release-a/SHA256SUMS

      - name: Rebuild a wheel from the sdist
        run: python -m pip wheel release-a/*.tar.gz --no-deps --no-build-isolation -w sdist-wheel

      - name: Validate package contents and metadata
        run: |
          WHEEL="$(find release-a -maxdepth 1 -name '*.whl' -print -quit)"
          SDIST_WHEEL="$(find sdist-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          python scripts/check_release_wheel.py "$WHEEL" --compare "$SDIST_WHEEL"
          python -m twine check release-a/*.whl release-a/*.tar.gz "$SDIST_WHEEL"
          check-wheel-contents "$WHEEL"
          check-wheel-contents "$SDIST_WHEEL"
          (cd release-a && sha256sum --check SHA256SUMS)

      - name: Smoke-test both wheels in clean environments
        run: |
          WHEEL="$(find release-a -maxdepth 1 -name '*.whl' -print -quit)"
          SDIST_WHEEL="$(find sdist-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          python scripts/smoke_release_install.py "$WHEEL" "$SDIST_WHEEL"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            release-a/*.whl
            release-a/*.tar.gz
            release-a/SHA256SUMS
          if-no-files-found: error
          archive: true
          compression-level: 0
          retention-days: 30

  attest:
    name: Verify artifacts and sign provenance when available
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release

      - name: Verify downloaded checksums
        run: cd release && sha256sum --check SHA256SUMS

      - name: Generate signed provenance
        if: vars.ARTIFACT_ATTESTATION_ENABLED == 'true'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/SHA256SUMS

  github-release:
    name: Publish GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release

      - name: Create or update immutable-tag release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release view "$GITHUB_REF_NAME" \
              --json assets --jq '.assets[].name' \
              --repo "$GITHUB_REPOSITORY" > existing-assets.txt
            python scripts/prepare_release.py check-assets \
              --dist release \
              --existing existing-assets.txt
            if test -s existing-assets.txt; then
              gh release download "$GITHUB_REF_NAME" \
                --dir existing-release \
                --repo "$GITHUB_REPOSITORY"
            fi
            for artifact in release/*; do
              existing="existing-release/$(basename "$artifact")"
              if test -f "$existing"; then
                cmp --silent "$artifact" "$existing" || {
                  echo "Refusing to overwrite changed release asset: $(basename "$artifact")" >&2
                  exit 1
                }
              else
                gh release upload "$GITHUB_REF_NAME" "$artifact" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "SkyN3t $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi

  pypi:
    name: Publish to PyPI with trusted identity
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [build, attest, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/skyn3t
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release

      - name: Select Python distributions only
        run: |
          mkdir pypi-dist
          cp release/*.whl release/*.tar.gz pypi-dist/

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: pypi-dist/
