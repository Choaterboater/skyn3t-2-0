[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyn3t"
version = "2.0.0"
description = "SkyN3t 2.0 — Autonomous Multi-Agent App Factory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stephen Choate" }]

# Lightweight core: the spine (config, core, memory, cli) runs on just these.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # Cross-platform interactive process driver for the default cli_playtest gate.
    "pexpect>=4.9",
]

[project.optional-dependencies]
# Heavy ML/RAG stack — optional; the system degrades gracefully without it.
ml = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.9",  # 3.13-compatible successor to tree-sitter-languages
    "rank-bm25>=0.2",
]
# Web dashboard + API.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "jinja2>=3.1",
]
# Optional messaging + observability integrations.
integrations = [
    "prometheus-client>=0.20",
]
# Responsive browser evidence + visual self-inspection. Needs
# `playwright install chromium` after install. Deterministic desktop/mobile proof
# needs no LLM; the optional subjective vision judgement does. Pillow backs
# a cheap, dependency-soft heuristic (flash-frame detection) that retakes a
# mid-play game screenshot landing on a transient full-screen FX (e.g. a
# damage-flash camera tint) — without it, that retake optimization just skips.
visual = [
    "playwright>=1.40",
    "pillow>=10.0",
]
dev = [
    # Imported during collection or needed to keep web/visual integration tests
    # from silently skipping; `.[dev]` is the complete test environment.
    "fastapi>=0.110",
    "jinja2>=3.1",
    "pillow>=10.0",
    "playwright>=1.40",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
skyn3t = "skyn3t.cli.main:app"

[project.urls]
Homepage = "https://github.com/Choaterboater/skyn3t-2-0"
Repository = "https://github.com/Choaterboater/skyn3t-2-0"
Issues = "https://github.com/Choaterboater/skyn3t-2-0/issues"

[tool.setuptools]
# Ship only the package data declared below. This avoids setuptools treating
# Vite's extensionless dist/assets/fonts directories as namespace packages.
include-package-data = false

[tool.setuptools.packages.find]
include = ["skyn3t*"]
namespaces = false

[tool.setuptools.package-data]
# Golden acceptance data must be available from installed wheels, not just a checkout.
"skyn3t.benchmarks" = ["golden-v1.json"]
# The dashboard is part of the installed application, not a source-only extra.
"skyn3t.web" = [
    "ui/dist/index.html",
    "ui/dist/THIRD_PARTY_NOTICES.txt",
    "ui/dist/assets/*",
    "ui/dist/fonts/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Exception in thread .*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "real_cli_vision: opt out of the suite-wide CLI-vision neutering (test stubs which/subprocess itself)",
    "requires_loopback: test binds a local 127.0.0.1 socket and is skipped when loopback bind is unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
